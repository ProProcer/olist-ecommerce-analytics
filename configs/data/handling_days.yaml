path: data/processed/handling_days_train.csv
target: handling_days
timestamp: order_approved_at
numerical_cols: 
- seller_lat
- seller_lng
- item_count
- volume_m3
- weight_kg
- total_price
- total_freight_value
- handling_days
categorical_cols:
- seller_state
transforms:
- _target_: src.data.transforms.select_columns
  _partial_: true
  cols: "${add : ${data.numerical_cols}, ${data.categorical_cols}, [${data.timestamp}]}"
- _target_: src.data.transforms.parse_datetime
  _partial_: true
  cols: ["${data.timestamp}"]
- _target_: src.data.transforms.cast_dtypes
  _partial_: true
  cols: "${data.numerical_cols}"
  dtype: "float32"
- _target_: src.data.transforms.cast_dtypes
  _partial_: true
  cols: "${data.categorical_cols}"
  dtype: "category"
